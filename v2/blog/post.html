</head>
<body>

			<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
		</a>

	<div class="bg_base" aria-hidden="true"></div>
	<div class="aurora_orbs" aria-hidden="true"><div class="aurora_orb"></div><div class="aurora_orb"></div></div>
	<div class="bg_grid" aria-hidden="true"></div>
	<div class="noise_overlay" aria-hidden="true"></div>
	<div id="spotlight" aria-hidden="true"></div>

	<nav class="site_nav">
		<div class="nav_inner">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
			</a>
<a class="nav_logo" href="../index.html">Rray</a>
			<button class="nav_hamburger" id="navHamburger" aria-label="菜单"><i data-lucide="menu"></i></button>
			<div class="nav_links" id="navLinks">
				<a href="../index.html" class="nav_link">首页</a>

				<a href="index.html" class="nav_link">博客</a>
				<a href="../guestbook.html" class="nav_link">留言板</a>
			</div>
			<button id="themeToggleNav" class="theme_toggle_btn" style="position:static;width:32px;height:32px;" aria-label="切换主题">
				<span id="icon_sun"><i data-lucide="sun"></i></span>
				<span id="icon_moon"><i data-lucide="moon"></i></span>
			</button>

	<main class="page_content" id="postContainer" style="padding-top:24px;">
	<div id="postLoading" style="text-align:center;padding:60px 0;color:var(--c-text-dim);">加载中...</div>
		<article id="postContent" style="display:none;">
			<header id="postHeader" style="margin-bottom:32px;">
				<h1 id="postTitle" style="font-size:1.5rem;color:var(--c-text-heading);font-weight:700;line-height:1.35;margin-bottom:8px;"></h1>
				<div id="postMeta" style="display:flex;flex-wrap:wrap;gap:8px;font-size:0.72rem;color:var(--c-text-muted);margin-bottom:6px;">
					<span id="postDate"></span>
					<span id="postTags"></span>
				</div>
				<div id="postReading" style="font-size:0.68rem;color:var(--c-text-dim);"></div>
			</header>
			<div id="postBody" class="post_body keep_markdown_body"></div>
		</article>
		<div id="postError" style="display:none;text-align:center;padding:60px 0;color:var(--c-text-dim);">文章未找到</div>
	</main>

	<!-- TOC 侧边栏 -->
	<nav id="tocSidebar" class="toc_sidebar" style="display:none;">
		<div class="toc_title">目录</div>
		<ul id="tocList"></ul>
	</nav>

	<!-- 阅读进度条 -->
	<div id="postProgress" class="scroll_progress" style="z-index:55;"></div>

	<script src="../assets/js/main.js"></script>
	<script>
		// ===== 博客文章渲染 =====
		(function(){
			var slug=new URLSearchParams(window.location.search).get('slug');
			if(!slug){document.getElementById('postError').style.display='block';document.getElementById('postLoading').style.display='none';return;}

			// 读取文章索引获取元数据
			fetch('posts/index.json').then(function(r){return r.json();}).then(function(index){
				var meta=index.posts.find(function(p){return p.slug===slug;});
				if(!meta){throw new Error('not found');}

				// 填充元数据
				document.getElementById('postTitle').textContent=meta.title;
				document.getElementById('postDate').textContent=meta.date;
				document.title=meta.title+' · Rray';
				if(meta.tags&&meta.tags.length){
					document.getElementById('postTags').innerHTML='<span>🏷</span>'+meta.tags.map(function(t){return '<span style="color:var(--c-tag-text);background:var(--c-tag-bg);padding:1px 8px;border-radius:99px;font-size:0.65rem;">'+t+'</span>';}).join('');
				}

				// 加载 Markdown 内容
				return fetch('posts/'+slug+'.md').then(function(r){if(!r.ok)throw new Error('fetch md');return r.text();}).then(function(md){
					// marked 配置
					marked.setOptions({breaks:true,gfm:true});
					var html=marked.parse(md);

					// 注入文章主体
					document.getElementById('postBody').innerHTML=html;
					document.getElementById('postLoading').style.display='none';
					document.getElementById('postContent').style.display='block';

					// 字数统计 & 阅读时长
					var text=md.replace(/[#*`\[\]()>|~]/g,'').replace(/\s+/g,'');
					var wc=text.length;
					var min=Math.max(1,Math.round(wc/500));
					document.getElementById('postReading').textContent='约 '+wc+' 字 · 阅读 '+min+' 分钟';

					// 生成 TOC
					var body=document.getElementById('postBody');
					var headings=body.querySelectorAll('h2,h3');
					var tocList=document.getElementById('tocList');
					if(headings.length>2){
						headings.forEach(function(h,i){
							var id='h'+i;
							h.setAttribute('id',id);
							var li=document.createElement('li');
							li.className='toc_item toc_'+h.tagName.toLowerCase();
							var a=document.createElement('a');
							a.href='#'+id;
							a.textContent=h.textContent;
							a.className='toc_link';
							a.addEventListener('click',function(e){e.preventDefault();document.getElementById(id).scrollIntoView({behavior:'smooth'});});
							li.appendChild(a);
							tocList.appendChild(li);
						});
						document.getElementById('tocSidebar').style.display='block';
					}

					// 代码块添加复制按钮
					body.querySelectorAll('pre code').forEach(function(block){
						var pre=block.parentNode;
						var wrapper=document.createElement('div');
						wrapper.className='code_wrap';
						var lang=(block.className||'').replace('language-','').trim()||'code';
						var header=document.createElement('div');
						header.className='code_header';
						header.innerHTML='<span class="code_lang">'+lang+'</span><button class="code_copy" onclick="(function(b){var t=b.textContent;navigator.clipboard.writeText(t).then(function(){b.textContent=\'已复制\';setTimeout(function(){b.textContent=\'复制\';},2000);});})(this)">复制</button>';
						pre.parentNode.insertBefore(wrapper,pre);
						wrapper.appendChild(header);
						wrapper.appendChild(pre);
					});

					// 滚动高亮 TOC
					var tocLinks=document.querySelectorAll('.toc_link');
					if(tocLinks.length){
						var observer=new IntersectionObserver(function(entries){
							entries.forEach(function(e){
								if(e.isIntersecting){
									tocLinks.forEach(function(l){l.classList.remove('toc_active');});
									var id=e.target.getAttribute('id');
									document.querySelector('.toc_link[href="#'+id+'"]')?.classList.add('toc_active');
								}
							});
						},{rootMargin:'-80px 0px -70% 0px'});
						body.querySelectorAll('h2,h3').forEach(function(h){observer.observe(h);});
					}
				});
			}).catch(function(){
				document.getElementById('postLoading').style.display='none';
				document.getElementById('postError').style.display='block';
			});

			// 阅读进度条
			window.addEventListener('scroll',function(){
				var st=window.scrollY||document.documentElement.scrollTop;
				var dh=document.documentElement.scrollHeight-window.innerHeight;
				var bar=document.getElementById('postProgress');
				if(dh>0)bar.style.width=((st/dh)*100)+'%';
			});
		})();
	</script>
</body>
</html>
